<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>骑自行车的鹈鹕 · SVG 动画</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; }
    body { background:#eef1e9; color:#193e40; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:36px 5vw; }
    main { max-width:1180px; margin:auto; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:24px; }
    .eyebrow { font-size:11px; letter-spacing:.23em; font-weight:750; color:#73847c; }
    h1 { font-size:clamp(28px,4vw,48px); letter-spacing:-.05em; margin:8px 0; font-weight:650; }
    header p { color:#718078; font-size:14px; margin:0; }
    .badge { border:1px solid #b9ccc0; padding:9px 14px; border-radius:30px; font-size:12px; white-space:nowrap; }
    .stage { position:relative; border-radius:26px; overflow:hidden; background:#d8f3f1; box-shadow:0 18px 50px #174d3e12; border:1px solid #fff; }
    .scene { width:100%; height:auto; display:block; aspect-ratio:5/3; }

    .scene { transition:filter .7s; }
    .status { position:absolute; top:22px; left:24px; z-index:1; display:flex; align-items:center; gap:8px; background:#ffffffb8; backdrop-filter:blur(10px); padding:8px 12px; border-radius:20px; font-size:11px; letter-spacing:.12em; }
    .dot { width:6px; height:6px; border-radius:50%; background:#36a78c; }
    .panel { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:32px; background:#ffffff; padding:25px 28px; border-radius:22px; margin-top:16px; border:1px solid #dde7dc; }
    .buttons { display:flex; gap:9px; }
    button { font:inherit; cursor:pointer; border:1px solid #dbe4da; background:#f4f6f0; color:#244a45; border-radius:12px; padding:13px 17px; transition:background .2s,transform .2s; }
    button:hover { background:#e2ebe0; transform:translateY(-1px); }
    button:focus-visible,input:focus-visible { outline:3px solid #efad56; outline-offset:4px; }
    #toggle { background:#214e44; color:#fff; border-color:#214e44; min-width:112px; }
    .speed-label { display:flex; justify-content:space-between; font-size:13px; margin-bottom:9px; }
    output { font-weight:700; font-variant-numeric:tabular-nums; }
    input[type=range] { width:100%; accent-color:#2e806d; cursor:pointer; }
    .range-labels { display:flex; justify-content:space-between; color:#8a968e; font-size:10px; }
    .stats { min-width:100px; border-left:1px solid #e3e8df; padding-left:28px; }
    .stats strong { font-size:28px; font-weight:550; font-variant-numeric:tabular-nums; }
    .stats small { display:block; color:#7b8e82; font-size:11px; margin-top:4px; }
    footer { display:flex; justify-content:space-between; gap:12px; color:#839087; font-size:11px; padding:18px 3px; }
    @media(max-width:650px) { body{padding:22px 16px} header{align-items:flex-start} header p{font-size:12px} .badge{display:none} .panel{grid-template-columns:1fr auto;gap:20px;padding:20px} .buttons{grid-column:1/-1} .buttons button{flex:1} .stats{padding-left:16px;min-width:80px} footer{flex-direction:column} .status{top:12px;left:12px;font-size:9px} .stage{border-radius:18px} }
    .frame-outline { fill: none; stroke: #153f50; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    .frame-light { fill: none; stroke: #36aeb2; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .metal { fill: none; stroke: #163d4e; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    .leg-back { fill: none; stroke: #b17939; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    .leg-front { fill: none; stroke: #dc9a47; stroke-width: 17; stroke-linecap: round; stroke-linejoin: round; }
    .foot { fill: none; stroke: #da8b38; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-reduced-motion: reduce) {
      .decorative-cloud { animation: none !important; }
    }
    body { background:radial-gradient(ellipse at 80% 0%,#dce8df,transparent 55%),#f3f3eb; }
    .stage { isolation:isolate; }
    .scene { background:#acdee3; }
    .scene stop,.scene [data-palette] { transition:stop-color 1.2s,fill 1.2s; }
    .scene #stars,.scene #headlight { transition:opacity 1s; }
    .scene-tools { position:absolute; right:20px;top:20px; z-index:2; }
    .scene-tools button { background:#ffffffaa; padding:8px 12px; font-size:12px; backdrop-filter:blur(8px); }
    .route-bar { display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 16px; }
    .routes { display:flex;gap:6px; }
    .routes button { font-size:12px;padding:10px 18px;border-radius:24px;background:transparent; }
    .routes button[aria-pressed=true] { background:#244e44;color:#fff;border-color:#244e44; }
    .route-caption { font-size:11px;color:#7d8c83;letter-spacing:.05em; }
    .telemetry { display:flex;gap:32px;padding:22px 6px 4px; }
    .telemetry div { flex:1; }
    .telemetry span { display:block;font-size:10px;letter-spacing:.13em;color:#7a8e80;margin-bottom:7px; }
    .telemetry b { font-size:23px;font-weight:500;font-variant-numeric:tabular-nums; }
    .telemetry small { font-size:11px;color:#88968a;margin-left:5px; }
    .ride-track { height:2px;background:#d8e2d7;margin-top:20px;overflow:hidden; }
    #journey-progress { height:100%;background:#4a8b72;width:0; }
    main:fullscreen { background:#eef1e9;max-width:none;padding:20px;overflow:auto; }
    main:fullscreen .stage { max-width:1100px;margin:auto; }
    @media(max-width:650px) { .route-caption{display:none}.routes{width:100%}.routes button{flex:1;padding:9px 12px}.telemetry{gap:14px}.telemetry b{font-size:19px}.scene-tools{top:10px;right:10px}.scene-tools button{font-size:10px;padding:6px 9px} }
  </style>
</head>
<body>

  <path d="M686 295Q704 286 727 293" fill="none" stroke="#153e4c" stroke-width="10" stroke-linecap="round"/>

  <path d="M384 504Q427 523 471 512" fill="none" stroke="#1d5260" stroke-width="6"/>
  <circle cx="550" cy="520" r="32" fill="#173d4b"/>
  <circle cx="550" cy="520" r="23" fill="#e7bf72"/>
  <circle cx="550" cy="520" r="16" fill="#173d4b"/>

<section class="panel" aria-label="动画控制">
<div class="buttons"><button id="toggle" type="button" aria-pressed="false">Ⅱ 暂停</button><button id="reset" type="button" title="回到起点并恢复默认速度">↺ 重置</button></div>
<div><div class="speed-label"><label for="speed">骑行速度</label><output id="rate" for="speed">1.00×</output></div><input id="speed" type="range" min="0.25" max="3" step="0.05" value="1" aria-label="骑行速度倍率"><div class="range-labels"><span>悠闲 · 0.25×</span><span>疾驰 · 3×</span></div></div>

</main>
<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const rear = byId('rear-spin');
  const front = byId('front-spin');
  const bird = byId('bird');
  const road = byId('road-marks');
  const crankCenter = { x: 550, y: 520 };
  const crankRadius = 62;
  const thighLength = 137;
  const shinLength = 135;
  const crankSpeed = 3.4; // radians per second, clockwise in SVG coordinates
  const wheelRatio = 1.72; // the wheels turn faster than the cranks
  const wheelRadius = 125.5;
  const parts = {
    far:  { hip: { x: 501, y: 345 }, thigh: byId('far-thigh'), shin: byId('far-shin'), knee: byId('far-knee'), foot: byId('far-foot'), crank: byId('far-crank'), pedal: byId('far-pedal') },
    near: { hip: { x: 520, y: 346 }, thigh: byId('near-thigh'), shin: byId('near-shin'), knee: byId('near-knee'), foot: byId('near-foot'), crank: byId('near-crank'), pedal: byId('near-pedal') }
  };

  // The knee is the forward intersection of circles centered at hip and ankle.
  // Fixed segment lengths keep the legs connected throughout a full revolution.
  function kneeFor(hip, ankle) {
    const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
    const d = Math.hypot(dx, dy);
    const along = (thighLength ** 2 - shinLength ** 2 + d ** 2) / (2 * d);
    const height = Math.sqrt(Math.max(0, thighLength ** 2 - along ** 2));
    const mx = hip.x + along * dx / d, my = hip.y + along * dy / d;
    const a = { x: mx - height * dy / d, y: my + height * dx / d };
    const b = { x: mx + height * dy / d, y: my - height * dx / d };
    return a.x > b.x ? a : b;
  }

  function drawLeg(name, angle, bob) {
    const p = parts[name];
    const hip = { x: p.hip.x, y: p.hip.y + bob };
    const pedal = {
      x: crankCenter.x + crankRadius * Math.cos(angle),
      y: crankCenter.y + crankRadius * Math.sin(angle)
    };
    const ankle = { x: pedal.x - 7, y: pedal.y - 12 };
    const knee = kneeFor(hip, ankle);
    p.thigh.setAttribute('d', `M${hip.x} ${hip.y}L${knee.x} ${knee.y}`);
    p.shin.setAttribute('d', `M${knee.x} ${knee.y}L${ankle.x} ${ankle.y}`);
    p.knee.setAttribute('cx', knee.x);
    p.knee.setAttribute('cy', knee.y);
    p.foot.setAttribute('d', `M${ankle.x} ${ankle.y}Q${pedal.x - 5} ${pedal.y - 3} ${pedal.x + 14} ${pedal.y - 11}`);
    p.crank.setAttribute('d', `M550 520L${pedal.x} ${pedal.y}`);
    p.pedal.setAttribute('transform', `translate(${pedal.x} ${pedal.y})`);
  }

  let seconds = 0, rideTime = 0, lastTime = null, playing = !matchMedia("(prefers-reduced-motion: reduce)").matches, speed = 1, actualSpeed = 1;
  const toggle = byId('toggle'), slider = byId('speed');
  function syncControls() {
    toggle.textContent = playing ? 'Ⅱ 暂停' : '▶ 继续';
    toggle.setAttribute('aria-pressed', String(!playing));
    byId('status').textContent = playing ? '正在骑行' : '休息片刻';
    byId('dot').style.background = playing ? '#36a78c' : '#dda255';
    byId('rate').textContent = speed.toFixed(2) + '×';
    byId('cadence').textContent = playing ? Math.round(crankSpeed * speed * 60 / (2 * Math.PI)) : '0';
  }
  function pause() { playing = !playing; lastTime = null; syncControls(); }
  function reset() { seconds = 0; rideTime = 0; speed = 1; actualSpeed = 1; slider.value = '1'; playing = true; lastTime = null; syncControls(); }
  toggle.addEventListener('click', pause);
  byId('reset').addEventListener('click', reset);
  slider.addEventListener('input', () => { speed = Number(slider.value); syncControls(); });
  const palettes = {
    coast: ['#8cd6e4','#f8efce','#fff5c0','#6abec3','#d4d6ac','#e8d8b3','#668682','SALT IN THE AIR · 海风正好'],
    sunset: ['#b587b0','#ffdab0','#ffebbb','#b597ac','#bda4a0','#e8bd95','#807b85','GOLDEN HOUR · 追着落日骑行'],
    night: ['#182d4f','#567282','#e7efdf','#385c77','#566e79','#899186','#3c535f','UNDER THE STARS · 月光同行']
  };
  const routes = document.querySelectorAll('[data-route]');
  function setRoute(name) {
    const p = palettes[name];
    byId('sky-top').setAttribute('stop-color',p[0]); byId('sky-bottom').setAttribute('stop-color',p[1]);
    ['sun','sea','dunes','sand','asphalt'].forEach((id,i)=>byId(id).setAttribute('fill',p[i+2]));
    byId('stars').setAttribute('opacity',name==='night'?'1':'0');
    byId('headlight').setAttribute('opacity',name==='night'?'1':'0');
    byId('sun').setAttribute('cy',name==='sunset'?'300':'119');
    byId('sun').setAttribute('r',name==='night'?'40':'62');
    byId('route-caption').textContent=p[7];
    routes.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.route===name)));
  }
  routes.forEach(button=>button.addEventListener('click',()=>setRoute(button.dataset.route)));
  byId('fullscreen').addEventListener('click', async()=>{
    try {
      if(document.fullscreenElement) await document.exitFullscreen();
      else if(document.querySelector('main').requestFullscreen) await document.querySelector('main').requestFullscreen();
      else byId('fullscreen').textContent='浏览器暂不支持全屏';
    } catch { byId('fullscreen').textContent='请使用浏览器全屏功能'; }
  });
  document.addEventListener('fullscreenchange',()=>{byId('fullscreen').textContent=document.fullscreenElement?'⛶ 退出沉浸':'⛶ 沉浸模式';});
  document.addEventListener('keydown', event => {
    if (/INPUT|BUTTON|TEXTAREA|SELECT/.test(event.target.tagName)) return;
    if (event.code === 'Space') { event.preventDefault(); pause(); }
    if (event.key.toLowerCase() === 'r') reset();
  });
  document.addEventListener('visibilitychange', () => { lastTime = null; });
  function animate(timestamp) {
    if (lastTime !== null && playing) {
      const dt = Math.min((timestamp - lastTime) / 1000, .1);
      actualSpeed += (speed - actualSpeed) * (1 - Math.exp(-dt * 4));
      seconds += dt * actualSpeed;
      rideTime += dt;
    }
    lastTime = timestamp;
    const angle = seconds * crankSpeed - Math.PI / 3;
    const bob = 2.4 * Math.cos(2 * angle);
    const wheelAngle = seconds * crankSpeed * wheelRatio;
    const wheelDegrees = wheelAngle * 180 / Math.PI;
    rear.setAttribute('transform', `rotate(${wheelDegrees})`);
    front.setAttribute('transform', `rotate(${wheelDegrees})`);
    bird.setAttribute('transform', `translate(0 ${bob})`);
    drawLeg('far', angle + Math.PI, bob);
    drawLeg('near', angle, bob);
    // A wheel's arc length is the distance traveled along the road.
    const shift = (wheelAngle * wheelRadius) % 190;
    road.setAttribute('transform', `translate(${-shift} 0)`);
    const travel = wheelAngle * wheelRadius;
    byId('chain').setAttribute('stroke-dashoffset', -seconds * crankSpeed * 32);
    byId('gear').setAttribute('transform',`rotate(${angle*180/Math.PI} 550 520)`);
    byId('waves').setAttribute('transform',`translate(${-travel*.12%650} 0)`);
    byId('islands').setAttribute('transform',`translate(${-travel*.035%850} 0)`);
    byId('lighthouse').setAttribute('transform',`translate(${1300-(travel*.09+260)%1600} 345)`);
    byId('grasses').setAttribute('transform',`translate(${-travel*.5%1450} 0)`);
    ['cloud-a','cloud-b','cloud-c'].forEach((id,i)=>{ const origin=[180,425,1030][i]; const x=((origin-travel*(.018+i*.005)+100)%1400+1400)%1400-100; byId(id).setAttribute('transform',`translate(${x-origin} 0)`); });
    const flutter = Math.sin(seconds*9)*7;
    byId('scarf-tail').setAttribute('d',`M585 208C540 ${196+flutter} 512 ${211-flutter} 462 ${181+flutter}L459 ${202+flutter}Q515 ${242-flutter} 585 222Z`);
    const blink = seconds % 5.7;
    const eyeScale = blink>5.45 ? Math.max(.08,Math.abs(blink-5.575)/.125) : 1;
    byId('eye').setAttribute('transform',`translate(670 150) scale(1 ${eyeScale}) translate(-670 -150)`);
    const km = wheelAngle * .34 / 1000;
    byId('velocity').textContent = (playing ? actualSpeed*crankSpeed*wheelRatio*.34*3.6 : 0).toFixed(1);
    byId('distance').textContent = km.toFixed(3);
    byId('elapsed').textContent = String(Math.floor(rideTime/60)).padStart(2,'0')+':'+String(Math.floor(rideTime)%60).padStart(2,'0');
    byId('cadence').textContent = playing ? Math.round(actualSpeed*crankSpeed*60/(2*Math.PI)) : '0';
    byId('journey-progress').style.width=(km%1*100)+'%';
    requestAnimationFrame(animate);
  }
  syncControls();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
